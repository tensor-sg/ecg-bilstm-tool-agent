[pytest]
testpaths = tests
addopts = -ra
markers =
    model: needs the trained model in models/ and MIT-BIH data in data/mitdb (skipped otherwise)
    integration: runs the real app (lifespan, Chroma on disk, local embeddings, trained model)
    llm: calls real LLM APIs (OpenAI, Gemini); skipped unless RUN_LLM_TESTS=1
filterwarnings =
    ignore::DeprecationWarning
